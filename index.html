<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLINDSPOT — HCI Sandbox</title>
  <style>
    :root { color-scheme: dark; --ink: #e8edf8; --muted: #93a0b8; --panel: rgba(12, 17, 29, .82); --edge: rgba(153, 179, 229, .23); --cyan: #49e5ff; --pink: #ff5ca8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #080b12; color: var(--ink); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #workspace { display: block; width: 100vw; height: 100vh; cursor: crosshair; will-change: transform; transition: transform 110ms ease-out; }
    #overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .panel { position: absolute; top: 20px; left: 20px; width: min(342px, calc(100vw - 40px)); padding: 17px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); box-shadow: 0 16px 44px rgba(0,0,0,.27); backdrop-filter: blur(14px); pointer-events: auto; }
    h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .16em; } .eyebrow { margin: 0 0 15px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; } button { padding: 9px 7px; border: 1px solid var(--edge); border-radius: 6px; background: rgba(255,255,255,.04); color: var(--muted); font: inherit; cursor: pointer; } button:hover, button[aria-pressed="true"] { border-color: var(--cyan); background: rgba(73,229,255,.12); color: var(--ink); } button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
    .readouts { display: grid; gap: 7px; padding-top: 12px; border-top: 1px solid var(--edge); } .readout { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .key { color: var(--muted); } .value { color: var(--cyan); font-variant-numeric: tabular-nums; } .value.filtered { color: var(--pink); }
    .note { margin: 14px 0 0; color: var(--muted); font-size: 11px; } kbd { padding: 1px 4px; border: 1px solid var(--edge); border-radius: 3px; color: var(--ink); }
    .crosshair { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 1.5px solid currentColor; border-radius: 50%; opacity: .95; filter: drop-shadow(0 0 5px currentColor); } .crosshair::before, .crosshair::after { content: ""; position: absolute; background: currentColor; } .crosshair::before { top: 10px; left: -6px; width: 34px; height: 1px; } .crosshair::after { top: -6px; left: 10px; width: 1px; height: 34px; } #rawMarker { color: var(--cyan); } #filteredMarker { color: var(--pink); }
  </style>
</head>
<body>
  <canvas id="workspace" aria-label="BLINDSPOT grid workspace"></canvas>
  <div id="overlay" aria-live="polite">
    <section class="panel" aria-label="Simulation controls">
      <h1>BLINDSPOT</h1><p class="eyebrow">LOCAL HCI DEFLECTION SIMULATOR</p>
      <div class="modes" role="group" aria-label="Telemetry source"><button id="mockMode" type="button" aria-pressed="true">Mock telemetry</button><button id="clickMode" type="button" aria-pressed="false">Click telemetry</button></div>
      <div class="readouts"><div class="readout"><span class="key">RAW COORDINATES</span><output class="value" id="rawReadout">0, 0</output></div><div class="readout"><span class="key">FILTERED COORDINATES</span><output class="value filtered" id="filteredReadout">0, 0</output></div><div class="readout"><span class="key">CANVAS OFFSET</span><output class="value" id="offsetReadout">0, 0</output></div></div>
      <p class="note">Cyan = incoming telemetry · pink = filtered focus. In click mode, select a focus zone; move the pointer nearby to exercise the bounded deflection model.</p>
    </section>
    <div id="rawMarker" class="crosshair" aria-hidden="true"></div><div id="filteredMarker" class="crosshair" aria-hidden="true"></div>
  </div>
  <script>
  (() => {
    'use strict';
    /** Constant-velocity, 2D Kalman filter for local HCI telemetry simulation. */
    class OcularFilter {
      constructor() { this.state = [innerWidth / 2, innerHeight / 2, 0, 0]; this.covariance = [1, 1, 12, 12]; this.initialized = false; }
      update(rawX, rawY, deltaTime) {
        const dt = Math.max(0.001, Math.min(deltaTime, 0.1));
        if (!this.initialized) { this.state[0] = rawX; this.state[1] = rawY; this.initialized = true; return { x: rawX, y: rawY }; }
        this.state[0] += this.state[2] * dt; this.state[1] += this.state[3] * dt;
        this.covariance[0] += this.covariance[2] * dt * dt + .06; this.covariance[1] += this.covariance[3] * dt * dt + .06;
        const gainX = this.covariance[0] / (this.covariance[0] + 18); const gainY = this.covariance[1] / (this.covariance[1] + 18);
        const errorX = rawX - this.state[0], errorY = rawY - this.state[1];
        this.state[0] += gainX * errorX; this.state[1] += gainY * errorY;
        this.state[2] += gainX * errorX / dt * .09; this.state[3] += gainY * errorY / dt * .09;
        this.covariance[0] *= 1 - gainX; this.covariance[1] *= 1 - gainY;
        return { x: this.state[0], y: this.state[1] };
      }
    }
    /** Bounded, reversible canvas-only deflection used solely in this game simulation. */
    class DeflectionEngine {
      constructor(canvas) { this.canvas = canvas; this.offset = { x: 0, y: 0 }; this.pointer = { x: -9999, y: -9999 }; }
      setPointer(x, y) { this.pointer = { x, y }; }
      update(focus) {
        const dx = focus.x - this.pointer.x, dy = focus.y - this.pointer.y, distance = Math.hypot(dx, dy);
        let targetX = 0, targetY = 0;
        if (distance < 100 && distance > .01) { const force = (1 - distance / 100) * 46; targetX = dx / distance * force; targetY = dy / distance * force; }
        this.offset.x += (targetX - this.offset.x) * .15; this.offset.y += (targetY - this.offset.y) * .15;
        this.canvas.style.transform = `translate(${this.offset.x.toFixed(2)}px, ${this.offset.y.toFixed(2)}px)`;
        return this.offset;
      }
    }
    const $ = (id) => document.getElementById(id), canvas = $('workspace'), context = canvas.getContext('2d');
    const filter = new OcularFilter(), engine = new DeflectionEngine(canvas);
    const ui = { raw: $('rawReadout'), filtered: $('filteredReadout'), offset: $('offsetReadout'), rawMarker: $('rawMarker'), filteredMarker: $('filteredMarker'), mock: $('mockMode'), click: $('clickMode') };
    let mode = 'mock', raw = { x: innerWidth / 2, y: innerHeight / 2 }, filtered = raw, lastTime = performance.now(), clickFocus = null;
    const resize = () => { const dpr = devicePixelRatio || 1; canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; context.setTransform(dpr, 0, 0, dpr, 0, 0); };
    const drawGrid = () => { context.clearRect(0, 0, innerWidth, innerHeight); context.fillStyle = '#080b12'; context.fillRect(0, 0, innerWidth, innerHeight); context.strokeStyle = 'rgba(130, 160, 210, .10)'; context.lineWidth = 1; const size = 40; for (let x = 0; x <= innerWidth; x += size) { context.beginPath(); context.moveTo(x, 0); context.lineTo(x, innerHeight); context.stroke(); } for (let y = 0; y <= innerHeight; y += size) { context.beginPath(); context.moveTo(0, y); context.lineTo(innerWidth, y); context.stroke(); } };
    const setMode = (next) => { mode = next; ui.mock.setAttribute('aria-pressed', String(next === 'mock')); ui.click.setAttribute('aria-pressed', String(next === 'click')); if (next === 'click' && !clickFocus) clickFocus = { x: innerWidth / 2, y: innerHeight / 2 }; };
    ui.mock.addEventListener('click', () => setMode('mock')); ui.click.addEventListener('click', () => setMode('click'));
    window.addEventListener('resize', resize); window.addEventListener('pointermove', (event) => engine.setPointer(event.clientX, event.clientY));
    window.addEventListener('click', (event) => { if (mode === 'click' && !event.target.closest('button')) clickFocus = { x: event.clientX, y: event.clientY }; });
    const animate = (time) => { const dt = (time - lastTime) / 1000; lastTime = time; if (mode === 'mock') { const t = time / 1000; raw = { x: innerWidth * (.5 + .29 * Math.sin(t * .57) + .08 * Math.sin(t * 2.17)), y: innerHeight * (.5 + .25 * Math.cos(t * .43) + .06 * Math.sin(t * 1.73)) }; } else raw = clickFocus || raw; filtered = filter.update(raw.x, raw.y, dt); const offset = engine.update(filtered); drawGrid(); ui.raw.value = `${raw.x.toFixed(0)}, ${raw.y.toFixed(0)}`; ui.filtered.value = `${filtered.x.toFixed(0)}, ${filtered.y.toFixed(0)}`; ui.offset.value = `${offset.x.toFixed(0)}, ${offset.y.toFixed(0)}`; ui.rawMarker.style.transform = `translate(${raw.x}px, ${raw.y}px)`; ui.filteredMarker.style.transform = `translate(${filtered.x}px, ${filtered.y}px)`; requestAnimationFrame(animate); };
    resize(); requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
